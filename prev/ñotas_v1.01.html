<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Organizador de Notas</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #f4f4f4;
    font-family: sans-serif;
    user-select: none;
  }
  #board {
    position: relative;
    width: 100%; height: 100%;
  }
  .note {
    position: absolute;
    background: #fff;
    border: 1px solid #000;
    border-radius: 10px;
    padding: 10px;
    min-width: 80px;
    max-width: 250px;
    cursor: move;
    white-space: pre-wrap;
    word-wrap: break-word;
    text-align: center;
    box-sizing: border-box;
  }
  .note.selected {
    border: 2px solid #007bff;
    box-shadow: 0 0 10px rgba(0,0,255,0.2);
  }
  .selection-rect {
    position: absolute;
    border: 1px dashed #007bff;
    background: rgba(0,123,255,0.1);
    pointer-events: none;
  }
  .context-menu {
    position: absolute;
    background: #fff;
    border: 1px solid #aaa;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    z-index: 9999;
    display: none;
  }
  .context-menu div {
    padding: 6px 15px;
    cursor: pointer;
  }
  .context-menu div:hover {
    background: #007bff;
    color: #fff;
  }
  .placeholder {
    color: #bbb;
  }
</style>
</head>
<body>
<div id="board"></div>

<!-- Menú contextual fondo -->
<div id="menu-bg" class="context-menu">
  <div data-action="new">Nueva nota</div>
  <div data-action="save">Guardar esquema</div>
  <div data-action="load">Cargar esquema</div>
  <div data-action="export">Guardar imagen</div>
</div>

<!-- Menú contextual notas -->
<div id="menu-notes" class="context-menu">
  <div data-action="delete">Eliminar nota(s)</div>
  <div data-action="duplicate">Duplicar nota(s)</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const board = document.getElementById("board");
const menuBg = document.getElementById("menu-bg");
const menuNotes = document.getElementById("menu-notes");

let notes = [];
let selected = new Set();
let noteElements = new Map();
let history = [];
let redoStack = [];
let ctrlHeld = false;
let dragging = false;
let offset = {x:0, y:0};
let dragOrigin = null;
let selectionRect = null;
let selectionStart = null;
let justSelected = false;
let nextId = 1;

// ======== UTILIDADES ========
const clone = obj => JSON.parse(JSON.stringify(obj));
function pushHistory() {
  history.push(clone(notes));
  if (history.length > 50) history.shift();
  redoStack = [];
}

// ======== RENDER ========
function createNoteEl(note) {
  const el = document.createElement("div");
  el.className = "note";
  el.dataset.id = note.id;
  el.textContent = note.text || "";
  if (!note.text) el.classList.add("placeholder"), el.textContent = "...";
  board.appendChild(el);
  noteElements.set(note.id, el);
  updateNoteEl(note);
}
function updateNoteEl(note) {
  const el = noteElements.get(note.id);
  if (!el) return;
  el.style.zIndex = note.z;
  el.style.transform = `translate(${note.x}px, ${note.y}px)`;
  el.classList.toggle("selected", selected.has(note.id));
  if (note.text) {
    el.textContent = note.text;
    el.classList.remove("placeholder");
  } else {
    el.classList.add("placeholder");
    el.textContent = "...";
  }
}
function renderAll() {
  notes.forEach(n => {
    if (!noteElements.has(n.id)) createNoteEl(n);
    updateNoteEl(n);
  });
}

// ======== CREAR / EDITAR ========
function newNoteAt(x, y) {
  pushHistory();
  const note = { id: nextId++, x, y, z: nextId, text: "" };
  notes.push(note);
  createNoteEl(note);
  editNoteInline(note);
}
function editNoteInline(note) {
  const el = noteElements.get(note.id);
  el.setAttribute("contenteditable", "true");
  el.focus();
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
}
function stopEditing(el) {
  if (el.isContentEditable) {
    el.removeAttribute("contenteditable");
    const id = parseInt(el.dataset.id);
    const note = notes.find(n => n.id === id);
    if (note) {
      note.text = el.textContent.trim();
      pushHistory();
      updateNoteEl(note);
    }
  }
}

// ======== EVENTOS PRINCIPALES ========
board.addEventListener("dblclick", e => {
  if (e.target === board) {
    newNoteAt(e.offsetX, e.offsetY);
  } else if (e.target.classList.contains("note")) {
    editNoteInline(notes.find(n => n.id == e.target.dataset.id));
  }
});

board.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  const noteEl = e.target.closest(".note");
  if (noteEl) {
    const id = parseInt(noteEl.dataset.id);
    const note = notes.find(n => n.id === id);
    if (!ctrlHeld && !selected.has(id)) selected.clear();
    if (ctrlHeld && selected.has(id)) selected.delete(id);
    else selected.add(id);
    renderAll();
    dragging = true;
    dragOrigin = { x: e.clientX, y: e.clientY };
    offset = {};
  } else {
    selected.clear();
    renderAll();
    const rect = board.getBoundingClientRect();
    selectionStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    selectionRect = document.createElement("div");
    selectionRect.className = "selection-rect";
    board.appendChild(selectionRect);
  }
});

window.addEventListener("mousemove", e => {
  if (dragging) {
    e.preventDefault();
    const dx = e.clientX - dragOrigin.x;
    const dy = e.clientY - dragOrigin.y;
    dragOrigin = { x: e.clientX, y: e.clientY };
    requestAnimationFrame(() => {
      selected.forEach(id => {
        const note = notes.find(n => n.id === id);
        note.x += dx; note.y += dy;
        updateNoteEl(note);
      });
    });
  } else if (selectionStart) {
    const rect = board.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const x1 = Math.min(selectionStart.x, x), y1 = Math.min(selectionStart.y, y);
    const x2 = Math.max(selectionStart.x, x), y2 = Math.max(selectionStart.y, y);
    Object.assign(selectionRect.style, { left:x1+"px", top:y1+"px", width:(x2-x1)+"px", height:(y2-y1)+"px" });
    selected.clear();
    notes.forEach(n => {
      const el = noteElements.get(n.id);
      const rectN = el.getBoundingClientRect(), rectB = board.getBoundingClientRect();
      const nx1 = rectN.left - rectB.left, ny1 = rectN.top - rectB.top, nx2 = nx1 + rectN.width, ny2 = ny1 + rectN.height;
      if (!(nx2 < x1 || nx1 > x2 || ny2 < y1 || ny1 > y2)) selected.add(n.id);
    });
    renderAll();
  }
});

window.addEventListener("mouseup", e => {
  if (dragging) {
    dragging = false;
    pushHistory();
  }
  if (selectionRect) {
    selectionRect.remove();
    selectionRect = null;
    selectionStart = null;
  }
});

board.addEventListener("click", e => {
  if (e.target === board) {
    selected.clear();
    renderAll();
  }
});

window.addEventListener("keydown", e => {
  if (e.key === "Control") ctrlHeld = true;
  if (e.key === "Delete") deleteSelected();
  if (e.ctrlKey && e.key.toLowerCase() === "s") { e.preventDefault(); saveScheme(); }
  if (e.ctrlKey && e.key.toLowerCase() === "r") { e.preventDefault(); redo(); }
  if (e.ctrlKey && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
  if (e.ctrlKey && e.key.toLowerCase() === "p") { e.preventDefault(); exportImage(); }
  if (e.ctrlKey && e.key.toLowerCase() === "l") { e.preventDefault(); loadScheme(); }
});
window.addEventListener("keyup", e => { if (e.key === "Control") ctrlHeld = false; });

// ======== CONTEXT MENUS ========
document.addEventListener("contextmenu", e => {
  e.preventDefault();
  menuBg.style.display = "none";
  menuNotes.style.display = "none";
  if (e.target.classList.contains("note")) {
    const id = parseInt(e.target.dataset.id);
    if (!selected.has(id)) {
      selected.clear(); selected.add(id); renderAll();
    }
    showMenu(menuNotes, e.clientX, e.clientY);
  } else {
    showMenu(menuBg, e.clientX, e.clientY);
    menuBg.dataset.x = e.offsetX;
    menuBg.dataset.y = e.offsetY;
  }
});
document.addEventListener("click", () => {
  menuBg.style.display = "none";
  menuNotes.style.display = "none";
});
function showMenu(menu, x, y) {
  menu.style.left = x + "px";
  menu.style.top = y + "px";
  menu.style.display = "block";
}

menuBg.addEventListener("click", e => {
  const action = e.target.dataset.action;
  menuBg.style.display = "none";
  if (action === "new") newNoteAt(parseInt(menuBg.dataset.x), parseInt(menuBg.dataset.y));
  if (action === "save") saveScheme();
  if (action === "load") loadScheme();
  if (action === "export") exportImage();
});
menuNotes.addEventListener("click", e => {
  const action = e.target.dataset.action;
  menuNotes.style.display = "none";
  if (action === "delete") deleteSelected();
  if (action === "duplicate") duplicateSelected();
});

// ======== FUNCIONES CLAVE ========
function deleteSelected() {
  if (!selected.size) return;
  pushHistory();
  notes = notes.filter(n => !selected.has(n.id));
  selected.forEach(id => {
    const el = noteElements.get(id);
    if (el) el.remove();
    noteElements.delete(id);
  });
  selected.clear();
}
function duplicateSelected() {
  if (!selected.size) return;
  pushHistory();
  const toDuplicate = notes.filter(n => selected.has(n.id));
  selected.clear();
  toDuplicate.forEach(n => {
    const copy = {...n, id: nextId++, x: n.x + 20, y: n.y + 20, z: nextId};
    notes.push(copy);
    createNoteEl(copy);
    selected.add(copy.id);
  });
  renderAll();
}
function undo() {
  if (!history.length) return;
  redoStack.push(clone(notes));
  notes = history.pop();
  selected.clear();
  board.querySelectorAll(".note").forEach(el => el.remove());
  noteElements.clear();
  notes.forEach(createNoteEl);
  renderAll();
}
function redo() {
  if (!redoStack.length) return;
  history.push(clone(notes));
  notes = redoStack.pop();
  selected.clear();
  board.querySelectorAll(".note").forEach(el => el.remove());
  noteElements.clear();
  notes.forEach(createNoteEl);
  renderAll();
}
function saveScheme() {
  const blob = new Blob([JSON.stringify(notes)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "esquema.json";
  a.click();
}
function loadScheme() {
  const input = document.createElement("input");
  input.type = "file"; input.accept = ".json";
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    file.text().then(txt => {
      pushHistory();
      notes = JSON.parse(txt);
      selected.clear();
      board.querySelectorAll(".note").forEach(el => el.remove());
      noteElements.clear();
      notes.forEach(n => { if (n.id >= nextId) nextId = n.id+1; createNoteEl(n); });
      renderAll();
    });
  };
  input.click();
}
function exportImage() {
  const transparent = confirm("¿Fondo transparente?");
  html2canvas(board, { backgroundColor: transparent ? null : "#f4f4f4" }).then(canvas => {
    const link = document.createElement("a");
    link.download = "esquema.png";
    link.href = canvas.toDataURL();
    link.click();
  });
}
board.addEventListener("blur", e => stopEditing(e.target), true);
board.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.shiftKey && e.target.isContentEditable) {
    document.execCommand("insertLineBreak");
    e.preventDefault();
  } else if (e.key === "Enter" && e.target.isContentEditable) {
    stopEditing(e.target);
    e.preventDefault();
  }
});
</script>
</body>
</html>
